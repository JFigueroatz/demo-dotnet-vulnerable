name: seguridad-dotnet

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dtrack
      POSTGRES_USER: dtrack
      POSTGRES_PASSWORD: dtrack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  dtrack-apiserver:
    image: ghcr.io/dependencytrack/apiserver:5.1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DT_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dtrack
      DT_DATASOURCE_USERNAME: dtrack
      DT_DATASOURCE_PASSWORD: dtrack
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - dtrack-data:/data
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  dtrack-frontend:
    image: ghcr.io/dependencytrack/frontend:5.1.0
    depends_on:
      - dtrack-apiserver
    environment:
      API_BASE_URL: http://localhost:8080
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: seguridad-dotnet/jenkins:local
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - .:/workspace:ro
    restart: unless-stopped

volumes:
  postgres-data:
  dtrack-data:
  jenkins-data:
